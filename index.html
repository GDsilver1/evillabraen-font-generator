<!doctype html>
<!--
FONT STUDIO — GITHUB PAGES

Put these files next to this index.html:
  /fonts/bdon.ttf
  /fonts/braen.ttf

To rename a font file, edit BUILT_IN_FONTS in the script at the bottom.
Bdon's Handwriting is selected by default.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Font Studio — TTF PNG Generator</title><style>
:root{--bg:#0b0d12;--panel:#121620;--text:#f4f7fb;--muted:#929bad;--line:#293142;--accent:#7c5cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#1b1732 0,#0b0d12 38%),#0b0d12;color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:720px}.app{display:grid;grid-template-columns:330px 1fr;min-height:100vh}aside{background:rgba(12,15,22,.94);border-right:1px solid var(--line);padding:20px;overflow:auto}main{display:flex;flex-direction:column;min-width:0}h1{font-size:20px;margin:0 0 5px}.sub{color:var(--muted);font-size:12px;margin-bottom:20px}.group{border-top:1px solid var(--line);padding:16px 0}.group:first-of-type{border-top:0;padding-top:0}.group h2{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#aeb7c9;margin:0 0 12px}label{display:block;font-size:12px;color:#cbd2df;margin:10px 0 6px}input[type=text],input[type=number],select{width:100%;background:#0e121a;color:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px;outline:none}input:focus,select:focus{border-color:#6550db}input[type=range]{width:100%;accent-color:var(--accent)}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.check{display:flex;align-items:center;gap:8px;margin:10px 0;color:#cbd2df;font-size:12px}.check input{accent-color:var(--accent)}.colorRow{display:grid;grid-template-columns:42px 1fr;gap:8px}input[type=color]{width:42px;height:38px;padding:2px;border-radius:8px;border:1px solid var(--line);background:#0e121a}button{border:0;border-radius:9px;padding:10px 12px;background:#202737;color:white;cursor:pointer;font-weight:700}button:hover{filter:brightness(1.12)}.primary{background:linear-gradient(135deg,#7c5cff,#4e8cff)}.small{padding:7px 9px;font-size:11px}.toolbar{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:10px}.status{font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px}.stageWrap{flex:1;display:grid;place-items:center;padding:28px;overflow:auto;background-image:linear-gradient(45deg,#11151d 25%,transparent 25%),linear-gradient(-45deg,#11151d 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#11151d 75%),linear-gradient(-45deg,transparent 75%,#11151d 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}.stage{box-shadow:0 24px 80px rgba(0,0,0,.45);max-width:100%;max-height:calc(100vh - 130px);overflow:auto;border-radius:4px}#canvas{display:block;max-width:100%;height:auto}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}.value{float:right;color:#fff;font-variant-numeric:tabular-nums}.hint{font-size:10px;color:#70798b;line-height:1.4;margin-top:7px}@media(max-width:850px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);max-height:48vh}.stageWrap{min-height:52vh}}
</style></head><body><div class="app"><aside>
<h1>Font Studio</h1><div class="sub">GitHub Pages TTF → PNG generator. Put your fonts in the fonts folder.</div>
<div class="group"><h2>Text</h2><label>Text</label><input id="text" type="text" value="Your Text Here"><label>Font size <span class="value" id="sizeVal">160</span> px</label><input id="size" type="range" min="8" max="500" value="160"><div class="row"><div><label>Letter spacing</label><input id="spacing" type="number" value="0"></div><div><label>Rotation</label><input id="rotation" type="number" value="0"></div></div><label>Horizontal align</label><select id="align"><option>center</option><option>left</option><option>right</option></select><label>Vertical align</label><select id="valign"><option>middle</option><option>top</option><option>bottom</option></select><label>Font</label><select id="builtInFont"><option value="bdon" selected>Bdon's Handwriting</option><option value="braen">Braen's Handwriting</option></select><label>Font</label><div class="row"><button class="file">Replace TTF<input id="fontFile" type="file" accept=".ttf,font/ttf"></button><button id="resetFont">Use selected font</button></div><div class="hint">The default TTF is physically embedded in this HTML. A replacement font is loaded locally and never uploaded.</div></div>
<div class="group"><h2>Fill</h2><div class="row"><div><label>Start color</label><div class="colorRow"><input id="color1" type="color" value="#ffffff"><input id="color1hex" value="#ffffff"></div></div><div><label>End color</label><div class="colorRow"><input id="color2" type="color" value="#8ab4ff"><input id="color2hex" value="#8ab4ff"></div></div></div><label class="check"><input id="gradient" type="checkbox" checked> Gradient fill</label><label>Opacity <span class="value" id="opacityVal">100%</span></label><input id="opacity" type="range" min="0" max="100" value="100"></div>
<div class="group"><h2>Outline</h2><label class="check"><input id="outlineOn" type="checkbox"> Enable border / stroke</label><div class="row"><div><label>Width</label><input id="outlineWidth" type="number" value="8" min="0" max="100"></div><div><label>Color</label><input id="outlineColor" type="color" value="#10131a"></div></div></div>
<div class="group"><h2>Shadow & Glow</h2><label class="check"><input id="shadowOn" type="checkbox" checked> Drop shadow</label><div class="three"><div><label>X</label><input id="shadowX" type="number" value="8"></div><div><label>Y</label><input id="shadowY" type="number" value="12"></div><div><label>Blur</label><input id="shadowBlur" type="number" value="18"></div></div><label>Shadow color</label><input id="shadowColor" type="color" value="#000000"><label class="check"><input id="glowOn" type="checkbox"> Glow</label><label>Glow blur <span class="value" id="glowVal">20</span></label><input id="glow" type="range" min="0" max="100" value="20"></div>
<div class="group"><h2>Canvas</h2><div class="row"><div><label>Width</label><input id="cw" type="number" value="1200" min="100" max="5000"></div><div><label>Height</label><input id="ch" type="number" value="500" min="100" max="5000"></div></div><label>Background</label><div class="colorRow"><input id="bgColor" type="color" value="#10131a"><input id="bgHex" value="#10131a"></div><label class="check"><input id="transparent" type="checkbox"> Transparent background</label></div>
<div class="group"><button class="primary" id="download" style="width:100%;font-size:14px">Download PNG</button><button id="copy" style="width:100%;margin-top:8px">Copy PNG to clipboard</button></div></aside>
<main><div class="toolbar"><div class="status" id="status">Loading embedded font…</div><div class="actions"><button class="small" id="reset">Reset settings</button><button class="small" id="fit">Fit preview</button></div></div><div class="stageWrap"><div class="stage"><canvas id="canvas" width="1200" height="500"></canvas></div></div></main></div>
<script>
// EASY FONT EDITING: put these files in a "fonts" folder next to index.html.
// Rename the paths below if your GitHub filenames are different.
const BUILT_IN_FONTS={
  bdon's handwriting:{name:"Bdon's Handwriting",file:"fonts/bdon.ttf"},
  braen's handwriting:{name:"Braen's Handwriting",file:"fonts/braen.ttf"}
  bdon's cursive:{name:"Bdon's Cursive",file:"fonts/BdonsCursive.ttf"}
};
let activeFontName='BuiltInTTF',activeFontFace=null;const $=id=>document.getElementById(id);const controls=['text','size','spacing','rotation','align','valign','builtInFont','color1','color1hex','color2','color2hex','gradient','opacity','outlineOn','outlineWidth','outlineColor','shadowOn','shadowX','shadowY','shadowBlur','shadowColor','glowOn','glow','cw','ch','bgColor','bgHex','transparent'];function hex(v){return /^#[0-9a-fA-F]{6}$/.test(v)?v:'#ffffff'}function syncColor(a,b){$(a).addEventListener('input',()=>{$(b).value=$(a).value;draw()});$(b).addEventListener('change',()=>{$(a).value=hex($(b).value);draw()})}syncColor('color1','color1hex');syncColor('color2','color2hex');syncColor('bgColor','bgHex');controls.forEach(id=>{const e=$(id);if(e){e.addEventListener('input',draw);e.addEventListener('change',draw)}});$('size').addEventListener('input',()=>$('sizeVal').textContent=$('size').value);$('opacity').addEventListener('input',()=>$('opacityVal').textContent=$('opacity').value+'%');$('glow').addEventListener('input',()=>$('glowVal').textContent=$('glow').value);
async function loadBuiltIn(id){const font=BUILT_IN_FONTS[id];try{const response=await fetch(font.file);if(!response.ok)throw new Error('Missing '+font.file);const buf=await response.arrayBuffer();if(activeFontFace)document.fonts.delete(activeFontFace);activeFontFace=new FontFace('BuiltInTTF',buf);await activeFontFace.load();document.fonts.add(activeFontFace);activeFontName='BuiltInTTF';$('status').textContent='Font: '+font.name;draw()}catch(err){console.error(err);$('status').textContent='Could not load '+font.name+' — check '+font.file;draw()}}
$('builtInFont').addEventListener('change',e=>loadBuiltIn(e.target.value));$('fontFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const buf=await f.arrayBuffer();if(activeFontFace)document.fonts.delete(activeFontFace);activeFontFace=new FontFace('LocalTTF',buf);await activeFontFace.load();document.fonts.add(activeFontFace);activeFontName='LocalTTF';$('status').textContent='Custom font: '+f.name;draw()}catch(err){alert('That TTF could not be loaded.')}});$('resetFont').onclick=()=>{ $('builtInFont').value='bdon';loadBuiltIn('bdon')};
function fontString(){return $('size').value+'px "'+activeFontName+'"'}function measureSpaced(x,s,sp){if(!sp)return x.measureText(s).width;let n=0;for(const ch of s)n+=x.measureText(ch).width;return n+sp*Math.max(0,s.length-1)}function drawLetters(x,s,tx,ty,sp,fn){let total=measureSpaced(x,s,sp),start=tx;if(x.textAlign==='center')start=tx-total/2;else if(x.textAlign==='right')start=tx-total;let p=start;for(const ch of s){fn(ch,p);p+=x.measureText(ch).width+sp}}
function paintText(x,s,tx,ty,sp,fill){x.fillStyle=fill;if(!sp){x.fillText(s,tx,ty);return}drawLetters(x,s,tx,ty,sp,(ch,px)=>x.fillText(ch,px,ty))}function strokeText(x,s,tx,ty,sp){if(!sp){x.strokeText(s,tx,ty);return}drawLetters(x,s,tx,ty,sp,(ch,px)=>x.strokeText(ch,px,ty))}
function draw(){const c=$('canvas'),w=Math.max(100,+$('cw').value||1200),h=Math.max(100,+$('ch').value||500);c.width=w;c.height=h;const x=c.getContext('2d');x.clearRect(0,0,w,h);if(!$('transparent').checked){x.fillStyle=hex($('bgColor').value);x.fillRect(0,0,w,h)}x.save();x.translate(w/2,h/2);x.rotate((+$('rotation').value||0)*Math.PI/180);x.font=fontString();x.textBaseline='middle';x.textAlign=$('align').value;x.globalAlpha=(+$('opacity').value||100)/100;const s=$('text').value||' ';const sp=+$('spacing').value||0;let tx=0;if($('align').value==='left')tx=-w/2+20;else if($('align').value==='right')tx=w/2-20;let ty=0;if($('valign').value==='top')ty=-h/2+(+$('size').value/2)+20;else if($('valign').value==='bottom')ty=h/2-(+$('size').value/2)-20;if($('shadowOn').checked){x.save();x.shadowColor=hex($('shadowColor').value);x.shadowBlur=+$('shadowBlur').value||0;x.shadowOffsetX=+$('shadowX').value||0;x.shadowOffsetY=+$('shadowY').value||0;paintText(x,s,tx,ty,sp,'#000');x.restore()}if($('glowOn').checked){x.save();x.shadowColor=hex($('color1').value);x.shadowBlur=+$('glow').value||0;paintText(x,s,tx,ty,sp,'#000');x.restore()}let fill;if($('gradient').checked){const g=x.createLinearGradient(0,-h/2,0,h/2);g.addColorStop(0,hex($('color1').value));g.addColorStop(1,hex($('color2').value));fill=g}else fill=hex($('color1').value);paintText(x,s,tx,ty,sp,fill);if($('outlineOn').checked){x.save();x.strokeStyle=hex($('outlineColor').value);x.lineWidth=+$('outlineWidth').value||0;x.lineJoin='round';strokeText(x,s,tx,ty,sp);x.restore()}x.restore()}
$('download').onclick=()=>{draw();const a=document.createElement('a');a.download='font-design.png';a.href=$('canvas').toDataURL('image/png');a.click()};$('copy').onclick=async()=>{try{draw();const blob=await new Promise(r=>$('canvas').toBlob(r,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);$('status').textContent='PNG copied to clipboard';setTimeout(()=>$('status').textContent='Ready',1500)}catch(e){alert('Clipboard image copy is not supported here. Use Download PNG instead.')}};$('reset').onclick=()=>location.reload();$('fit').onclick=()=>{const c=$('canvas'),wrap=document.querySelector('.stageWrap'),max=Math.min(wrap.clientWidth-56,wrap.clientHeight-56);c.style.width=(c.width>max?max:c.width)+'px'};(async()=>{await loadBuiltIn('bdon')})();
</script></body></html>
